<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Minidex</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <header class="cabecalho">

        <div class="marca">

            <img
                src="assets/img/logo.png"
                alt="Logo Minidex"
                class="logo"
            >

            <div class="marca-texto">

                <h1>Minidex</h1>

                <p>
                    Sua Pokédex pessoal
                </p>

            </div>

        </div>


        <div class="busca">

            <input
                type="text"
                id="campoBusca"
                placeholder="Pesquisar Pokémon..."
                autocomplete="off"
            >

        </div>

    </header>


    <main>

        <!-- ================================= -->
        <!-- FILTROS -->
        <!-- ================================= -->

        <section class="filtros-container">

            <!-- TIPOS -->

            <div class="grupo-filtro">

                <h2>Tipos</h2>

                <section
                    class="filtros"
                    id="filtrosTipos"
                >

                    <button
                        class="filtro ativo"
                        data-tipo="todos"
                    >
                        Todos
                    </button>

                </section>

            </div>


            <!-- GERAÇÕES -->

            <div class="grupo-filtro">

                <h2>Geração</h2>

                <section
                    class="filtros"
                    id="filtrosGeracoes"
                >

                    <button
                        class="filtro-geracao ativo"
                        data-geracao="todas"
                    >
                        Todas
                    </button>

                    <button
                        class="filtro-geracao"
                        data-geracao="1"
                    >
                        Gen I
                    </button>

                    <button
                        class="filtro-geracao"
                        data-geracao="2"
                    >
                        Gen II
                    </button>

                    <button
                        class="filtro-geracao"
                        data-geracao="3"
                    >
                        Gen III
                    </button>

                    <button
                        class="filtro-geracao"
                        data-geracao="4"
                    >
                        Gen IV
                    </button>

                    <button
                        class="filtro-geracao"
                        data-geracao="5"
                    >
                        Gen V
                    </button>

                    <button
                        class="filtro-geracao"
                        data-geracao="6"
                    >
                        Gen VI
                    </button>

                    <button
                        class="filtro-geracao"
                        data-geracao="7"
                    >
                        Gen VII
                    </button>

                    <button
                        class="filtro-geracao"
                        data-geracao="8"
                    >
                        Gen VIII
                    </button>

                    <button
                        class="filtro-geracao"
                        data-geracao="9"
                    >
                        Gen IX
                    </button>

                </section>

            </div>

        </section>


        <!-- ================================= -->
        <!-- POKÉMON -->
        <!-- ================================= -->

        <section
            class="grid-pokemon"
            id="gridPokemon"
        >

            <div class="carregando">
                Carregando Pokémon...
            </div>

        </section>

    </main>


    <!-- ================================= -->
    <!-- MODAL -->
    <!-- ================================= -->

    <div
        class="modal-overlay"
        id="modalOverlay"
    >

        <div
            class="modal"
            id="modal"
        >

            <button
                class="fechar-modal"
                id="fecharModal"
                aria-label="Fechar"
            >
                ×
            </button>


            <div id="conteudoModal">

                <!-- Conteúdo preenchido pelo JavaScript -->

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
