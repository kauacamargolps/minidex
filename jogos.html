<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MiniDex Games</title>

    <link rel="stylesheet" href="jogos.css">
</head>

<body>

    <header class="cabecalho-jogos">

        <a href="index.html" class="botao-voltar">
            ← MiniDex
        </a>

        <div class="titulo-jogos">
            <span>🎮</span>
            <h1>MiniDex Games</h1>
        </div>

        <div class="espaco-header"></div>

    </header>


    <main class="conteudo-jogos">

        <section class="introducao-jogos">

            <p class="mini-titulo">
                UNIVERSO POKÉMON
            </p>

            <h2>
                Jogos Pokémon
            </h2>

            <p>
                Explore os principais jogos da franquia Pokémon,
                suas regiões, ginásios, iniciais e muito mais.
            </p>

        </section>


        <!-- FILTROS -->

        <section class="filtros-jogos">

            <button class="filtro-jogo ativo" data-geracao="todas">
                Todas
            </button>

            <button class="filtro-jogo" data-geracao="1">
                Gen I
            </button>

            <button class="filtro-jogo" data-geracao="2">
                Gen II
            </button>

            <button class="filtro-jogo" data-geracao="3">
                Gen III
            </button>

            <button class="filtro-jogo" data-geracao="4">
                Gen IV
            </button>

            <button class="filtro-jogo" data-geracao="5">
                Gen V
            </button>

            <button class="filtro-jogo" data-geracao="6">
                Gen VI
            </button>

            <button class="filtro-jogo" data-geracao="7">
                Gen VII
            </button>

            <button class="filtro-jogo" data-geracao="8">
                Gen VIII
            </button>

            <button class="filtro-jogo" data-geracao="9">
                Gen IX
            </button>

        </section>


        <!-- GRID -->

        <section id="gridJogos" class="grid-jogos">

            <div class="estado-carregando">
                <div class="loader"></div>
                <p>Carregando jogos...</p>
            </div>

        </section>

    </main>


    <!-- =====================================================
         MODAL PRINCIPAL
    ====================================================== -->

    <div id="modalOverlay" class="modal-overlay">

        <div class="modal modal-principal">

            <button
                id="fecharModal"
                class="fechar-modal"
                aria-label="Fechar"
            >
                ×
            </button>

            <div id="conteudoModal">

                <!-- Conteúdo inserido pelo JavaScript -->

            </div>

        </div>

    </div>


    <!-- =====================================================
         MODAL SECUNDÁRIO
    ====================================================== -->

    <div id="modalSecundarioOverlay" class="modal-overlay modal-secundario-overlay">

        <div class="modal modal-secundario">

            <button
                id="fecharModalSecundario"
                class="fechar-modal"
                aria-label="Fechar"
            >
                ×
            </button>

            <div id="conteudoModalSecundario">

                <!-- Conteúdo inserido pelo JavaScript -->

            </div>

        </div>

    </div>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- JAVASCRIPT -->

    <script src="jogos.js"></script>

</body>

</html>
